name: Build executables

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PoorManLabTool-windows
            artifact_path: dist/PoorManLabTool.exe
          - os: ubuntu-latest
            artifact_name: PoorManLabTool-linux
            artifact_path: dist/PoorManLabTool
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller PoorManLabTool.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}